<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000f2e" />
    <meta name="description" content="Your ultimate companion for event discovery and seamless ticket management." />
    <link rel="stylesheet" href="/index-BNPbQ385.css" />
    <title>AXS — Event tickets made simple</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f5f7fb; color: #000f2e; }
      main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
      .shell { width: min(960px, 100%); overflow: hidden; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgba(0, 15, 46, .12); }
      header { padding: 64px clamp(28px, 8vw, 88px); background: #000f2e; color: #fff; }
      .eyebrow { margin: 0 0 16px; color: #54d6c7; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(42px, 8vw, 76px); line-height: .98; letter-spacing: -.05em; }
      .intro { max-width: 560px; margin: 24px 0 0; color: #dbe4f2; font-size: 18px; line-height: 1.6; }
      .content { display: flex; flex-wrap: wrap; gap: 20px; padding: 32px clamp(28px, 8vw, 88px) 40px; }
      .content a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #54d6c7; color: #000f2e; font-weight: 700; text-decoration: none; }
      .content a:hover { background: #39b8aa; }
      .note { flex-basis: 100%; margin: 4px 0 0; color: #52617a; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="page-title">
        <header>
          <p class="eyebrow">AXS</p>
          <h1 id="page-title">Find your next event.</h1>
          <p class="intro">Your ultimate companion for event discovery and seamless ticket management.</p>
        </header>
        <div class="content">
          <a href="/profile">Open profile</a>
          <a href="/manage-tickets">Manage tickets</a>
          <p class="note">Choose a destination above to continue.</p>
        </div>
      </section>
    </main>
  </body>
</html>
